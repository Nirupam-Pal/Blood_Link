<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" width="1800" height="600">
  <!-- Hoarding, 3:1 (e.g. 30 x 10 ft). Outline all text before sending to print. -->
  <defs>
    <mask id="hero-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M39 51C40.5 40.29 51.5 34.5 51.5 25.5A12.5 12.5 0 0 0 26.5 25.5C26.5 34.5 37.5 40.29 39 51Z" stroke="#000" stroke-width="3.2" stroke-linejoin="round"/>
    </mask>
    <mask id="logo-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M39 51C40.5 40.29 51.5 34.5 51.5 25.5A12.5 12.5 0 0 0 26.5 25.5C26.5 34.5 37.5 40.29 39 51Z" stroke="#000" stroke-width="3.2" stroke-linejoin="round"/>
    </mask>
  </defs>

  <rect width="1800" height="600" fill="#9F1239"/>

  <!-- Hero symbol -->
  <g transform="translate(1076 -84) scale(12)">
    <path d="M25 13C26.5 23.71 37.5 29.5 37.5 38.5A12.5 12.5 0 0 1 12.5 38.5C12.5 29.5 23.5 23.71 25 13Z" fill="#F43F5E" mask="url(#hero-gap)"/>
    <path d="M39 51C40.5 40.29 51.5 34.5 51.5 25.5A12.5 12.5 0 0 0 26.5 25.5C26.5 34.5 37.5 40.29 39 51ZM34.4 25.5a4.6 4.6 0 1 0 9.2 0a4.6 4.6 0 1 0-9.2 0Z" fill="#FFFFFF" fill-rule="evenodd"/>
  </g>

  <!-- Message -->
  <g font-family="'Helvetica Neue', Inter, 'Segoe UI', Arial, sans-serif" fill="#FFFFFF">
    <text x="90" y="200" font-size="98" font-weight="800" letter-spacing="-3">Someone near you</text>
    <text x="90" y="305" font-size="98" font-weight="800" letter-spacing="-3">needs blood today.</text>
    <text x="92" y="378" font-size="36" font-weight="500" fill-opacity=".82">Find verified donors nearby and connect in minutes.</text>
  </g>

  <!-- Sign-off: white lockup + tagline -->
  <g transform="translate(90 528) scale(1.55)">
    <g transform="translate(-17.13 -61.84) scale(1.37)">
      <path d="M25 13C26.5 23.71 37.5 29.5 37.5 38.5A12.5 12.5 0 0 1 12.5 38.5C12.5 29.5 23.5 23.71 25 13Z" fill="#FFFFFF" mask="url(#logo-gap)"/>
      <path d="M39 51C40.5 40.29 51.5 34.5 51.5 25.5A12.5 12.5 0 0 0 26.5 25.5C26.5 34.5 37.5 40.29 39 51ZM34.4 25.5a4.6 4.6 0 1 0 9.2 0a4.6 4.6 0 1 0-9.2 0Z" fill="#FFFFFF" fill-rule="evenodd"/>
    </g>
    <g transform="translate(70 0)">
      <path fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M3 -33V-3M3 -12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M32 -33V-3M43 -12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M70 -12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M97 -12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M115 -33V-3M126 -33V-3M137 -21V-3M146 -21V-3M146 -12A9 9 0 0 1 164 -12V-3M175 -33V-3M192 -21L177 -9M183 -14L193 -3"/>
      <path fill="#FFFFFF" d="M137 -36.94C137.41 -34.03 140.4 -32.45 140.4 -30A3.4 3.4 0 0 1 133.6 -30C133.6 -32.45 136.59 -34.03 137 -36.94Z"/>
    </g>
  </g>
  <rect x="540" y="462" width="3" height="70" fill="#FFFFFF" fill-opacity=".45"/>
  <text x="575" y="512" font-family="'Helvetica Neue', Inter, 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-.5" fill="#FFFFFF">Be the link.</text>
</svg>
