<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" width="1800" height="600">
  <!-- Hoarding, 3:1 (e.g. 30 x 10 ft). Outline all text before sending to print. -->
  <defs>
    <mask id="hero-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M39 51C40.5 40.29 51.5 34.5 51.5 25.5A12.5 12.5 0 0 0 26.5 25.5C26.5 34.5 37.5 40.29 39 51Z" stroke="#000" stroke-width="3.2" stroke-linejoin="round"/>
    </mask>
  </defs>

  <rect width="1800" height="600" fill="#FFF6F5"/>

  <!-- Hero symbol -->
  <g transform="translate(-12 -52) scale(11)">
    <path d="M25 13C26.5 23.71 37.5 29.5 37.5 38.5A12.5 12.5 0 0 1 12.5 38.5C12.5 29.5 23.5 23.71 25 13Z" fill="#F43F5E" mask="url(#hero-gap)"/>
    <path d="M39 51C40.5 40.29 51.5 34.5 51.5 25.5A12.5 12.5 0 0 0 26.5 25.5C26.5 34.5 37.5 40.29 39 51ZM34.4 25.5a4.6 4.6 0 1 0 9.2 0a4.6 4.6 0 1 0-9.2 0Z" fill="#9F1239" fill-rule="evenodd"/>
  </g>

  <!-- Message -->
  <g font-family="'Helvetica Neue', Inter, 'Segoe UI', Arial, sans-serif">
    <text x="690" y="215" font-size="112" font-weight="800" letter-spacing="-3.5" fill="#18181B">Every drop</text>
    <text x="690" y="330" font-size="112" font-weight="800" letter-spacing="-3.5" fill="#9F1239">finds its way.</text>
    <text x="694" y="405" font-size="36" font-weight="500" fill="#52525B">Verified blood donors near you. Connected in minutes.</text>
  </g>

  <!-- Sign-off: wordmark (the symbol is already the hero) -->
  <g transform="translate(694 528) scale(1.3)">
    <path fill="none" stroke="#18181B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M3 -33V-3M3 -12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M32 -33V-3M43 -12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M70 -12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M97 -12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M115 -33V-3M126 -33V-3M137 -21V-3M146 -21V-3M146 -12A9 9 0 0 1 164 -12V-3M175 -33V-3M192 -21L177 -9M183 -14L193 -3"/>
    <path fill="#F43F5E" d="M137 -36.94C137.41 -34.03 140.4 -32.45 140.4 -30A3.4 3.4 0 0 1 133.6 -30C133.6 -32.45 136.59 -34.03 137 -36.94Z"/>
  </g>
  <rect x="980" y="476" width="3" height="58" fill="#18181B" fill-opacity=".2"/>
  <text x="1010" y="516" font-family="'Helvetica Neue', Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-.4" fill="#9F1239">Be the link.</text>
</svg>
